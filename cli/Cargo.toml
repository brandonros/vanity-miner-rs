[package]
name = "vanity-miner"
version = "0.1.0"
edition = "2024"

[features]
# Preserve CUDA Oxide's existing all-mode build while allowing selective builds.
default = ["solana", "bitcoin", "ethereum", "shallenge", "self_test"]
gpu = ["dep:kernels", "dep:cuda-core", "dep:cuda-host"]
solana = ["logic/solana", "kernels?/kernel_solana"]
bitcoin = ["logic/bitcoin", "kernels?/kernel_bitcoin"]
ethereum = ["logic/ethereum", "kernels?/kernel_ethereum"]
shallenge = ["logic/shallenge", "kernels?/kernel_shallenge"]
self_test = ["logic/self_test", "kernels?/kernel_self_test"]

[dependencies]
logic = { path = "../logic", default-features = false }
clap = { version = "4", features = ["derive"] }
hex = "0.4.3"
rand = "0.8"
paste = "1.0"

[dependencies.kernels]
path = "../kernels"
default-features = false
optional = true

[dependencies.cuda-core]
workspace = true
optional = true

[dependencies.cuda-host]
workspace = true
optional = true
