[workspace]
resolver = "3"
members = ["crates/cli", "crates/logic"]
default-members = ["crates/cli", "crates/logic"]
exclude = ["vendor/crypto-bigint", "vendor/sec1", "crates/kernels/*"]

[patch.crates-io]
sec1 = { path = "vendor/sec1" }
# put compiler_fence behind a feature flag that is disabled by default
zeroize = { git = "https://github.com/brandonros/utils", rev = "4c9734e1ae4a6cb61db4693f9d164866f084ca97" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
