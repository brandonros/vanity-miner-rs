[package]
name = "kernel-rsa-modulus-metal"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
logic = { path = "../../logic", default-features = false, features = ["rsa-modulus"] }

