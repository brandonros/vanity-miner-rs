[package]
name = "kernel-shallenge-metal"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
logic = { path = "../../logic", default-features = false, features = ["shallenge"] }

[profile.release]
# Size, not speed: Apple compiles what it is given, and `z` miscompiles (llvm-metal #26).
opt-level = "s"
panic = "abort"
codegen-units = 1
