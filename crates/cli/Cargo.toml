[package]
name = "vanity-miner"
version = "0.1.0"
edition = "2024"

[features]
default = ["metal", "shallenge"]
metal = ["dep:llvm-metal-runtime", "dep:llvm-metal-abi", "dep:serde_json", "dep:sha2"]
solana = ["logic/solana"]
bitcoin = ["logic/bitcoin"]
ethereum = ["logic/ethereum"]
shallenge = ["logic/shallenge"]
p256-public-key = ["logic/p256-public-key", "dep:p256"]
p256-signature = ["logic/p256-signature", "dep:p256", "p256/ecdsa"]
rsa-common = ["dep:rsa", "dep:num-bigint-dig"]
rsa-modulus = ["rsa-common", "logic/rsa-modulus"]
rsa-pss = ["logic/rsa-pss", "rsa-common", "rsa/hazmat"]
self_test = [
    "self_test_solana",
    "self_test_bitcoin",
    "self_test_ethereum",
    "self_test_shallenge",
    "self_test_p256_public_key",
    "self_test_p256_signature",
    "self_test_rsa_pss",
    "self_test_rsa_modulus",
]
self_test_support = ["logic/self_test_support"]
self_test_solana = ["self_test_support", "logic/self_test_solana"]
self_test_bitcoin = ["self_test_support", "logic/self_test_bitcoin"]
self_test_ethereum = ["self_test_support", "logic/self_test_ethereum"]
self_test_shallenge = ["self_test_support", "logic/self_test_shallenge"]
self_test_p256_public_key = ["self_test_support", "logic/self_test_p256_public_key"]
self_test_p256_signature = ["self_test_support", "logic/self_test_p256_signature"]
self_test_rsa_pss = ["self_test_support", "logic/self_test_rsa_pss"]
self_test_rsa_modulus = ["self_test_support", "logic/self_test_rsa_modulus"]

[dependencies]
llvm-metal-runtime = { git = "https://github.com/brandonros/llvm-metal", rev = "154ec386346f5dee9b9ffb290d82eea0837ca4f9", optional = true }
llvm-metal-abi = { git = "https://github.com/brandonros/llvm-metal", rev = "154ec386346f5dee9b9ffb290d82eea0837ca4f9", optional = true }
sha2 = { version = "0.10", optional = true }
serde_json = { version = "1", optional = true }
ctrlc = { version = "3.4" }
num-bigint-dig = { version = "0.8.6", default-features = false, features = ["prime", "zeroize"], optional = true }
rsa = { version = "0.9.10", default-features = false, features = ["pem"], optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "pkcs8", "pem"], optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
logic = { path = "../logic", default-features = false }
clap = { version = "4", features = ["derive"] }
hex = "0.4.3"
rand = "0.8"
paste = "1.0"

[[example]]
name = "metal_bench"
required-features = ["metal", "shallenge"]

[[example]]
name = "metal_solana_bench"
required-features = ["metal", "solana"]

[dev-dependencies]
logic = { path = "../logic", default-features = false, features = ["test-vectors"] }

[[example]]
name = "metal_candidates_bench"
required-features = ["metal", "shallenge", "bitcoin", "ethereum", "solana", "p256-public-key", "p256-signature", "rsa-modulus", "rsa-pss"]
