[package]
name = "kernel-self-test-shallenge-device"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logic = { path = "../../../logic", default-features = false, features = ["self_test_shallenge"] }
cuda_std = { git = "https://github.com/brandonros/Rust-CUDA.git", rev = "7c07c618dd7c1c08af4d040a5fc422d9ebf8caff" }

# Device compilation is a separate Cargo invocation and target.
[workspace]

[patch.crates-io]
zeroize = { git = "https://github.com/brandonros/utils", rev = "4c9734e1ae4a6cb61db4693f9d164866f084ca97" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
