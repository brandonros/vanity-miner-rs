[package]
name = "kernels"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Standalone nonce reproduction, outside mode self-tests.
repro_nonce_sequence = []
default = ["shallenge"]
solana = ["logic/solana"]
bitcoin = ["logic/bitcoin"]
ethereum = ["logic/ethereum"]
shallenge = ["logic/shallenge"]
# Host-test aggregate; CUDA builds select one mode below.
self_test = [
    "self_test_solana",
    "self_test_bitcoin",
    "self_test_ethereum",
    "self_test_shallenge",
    "self_test_p256_public_key",
    "self_test_p256_signature",
    "self_test_rsa_pss",
    "self_test_rsa_modulus",
]
self_test_solana = ["logic/self_test_solana"]
self_test_bitcoin = ["logic/self_test_bitcoin"]
self_test_ethereum = ["logic/self_test_ethereum"]
self_test_shallenge = ["logic/self_test_shallenge"]
self_test_p256_public_key = ["logic/self_test_p256_public_key"]
self_test_p256_signature = ["logic/self_test_p256_signature"]
self_test_rsa_pss = ["logic/self_test_rsa_pss"]
self_test_rsa_modulus = ["logic/self_test_rsa_modulus"]
rsa-modulus = ["logic/rsa-modulus"]
rsa-pss = ["logic/rsa-pss"]
p256-public-key = ["logic/p256-public-key"]
p256-signature = ["logic/p256-signature"]

[dependencies]
logic = { path = "../logic", default-features = false }
cuda_std = { git = "https://github.com/brandonros/Rust-CUDA.git", rev = "5f27c96d0555b7552813f55270917a2c8ea469c4" }

[workspace]

[patch.crates-io]
zeroize = { git = "https://github.com/brandonros/utils", rev = "4c9734e1ae4a6cb61db4693f9d164866f084ca97" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
