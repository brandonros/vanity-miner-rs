[package]
name = "kernels"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["shallenge"]
solana = ["logic/solana"]
bitcoin = ["logic/bitcoin"]
ethereum = ["logic/ethereum"]
shallenge = ["logic/shallenge"]
self_test = ["logic/self_test"]

[dependencies]
logic = { path = "../logic", default-features = false }
cuda_std = { git = "https://github.com/brandonros/Rust-CUDA.git", rev = "059beda8781e681834e971b4af86d71c661b1f66" }

[workspace]

[patch.crates-io]
zeroize = { git = "https://github.com/brandonros/utils", rev = "4c9734e1ae4a6cb61db4693f9d164866f084ca97" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
