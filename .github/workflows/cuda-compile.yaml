name: cuda-compile

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build both host architectures and publish a tagged release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One Linux host suffices for the PTX compatibility artifact.
        arch: ${{ fromJSON(inputs.publish_release && '["x86_64", "aarch64"]' || '["x86_64"]') }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test PTX inventory gate
        run: python3 scripts/test-verify-ptx-entries.py

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: miner-all-llvm7-v1-${{ matrix.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.github/workflows/cuda-compile.yaml') }}-${{ github.sha }}
          restore-keys: |
            miner-all-llvm7-v1-${{ matrix.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock', '.github/workflows/cuda-compile.yaml') }}-

      - name: Build with nix devshell
        run: |
          nix develop --command cargo build -p vanity-miner --all-features --release --locked

          mkdir -p artifacts
          cp target/release/vanity-miner ./artifacts/vanity-miner-${{ matrix.arch }}

          # Keep the compiler output unchanged for downstream compatibility tests.
          cp target/cuda-builder/nvptx64-nvidia-cuda/release/kernels.ptx ./artifacts/output.ptx

          python3 scripts/verify-ptx-entries.py artifacts/output.ptx > artifacts/kernel-manifest.json
          git rev-parse HEAD > artifacts/source-commit.txt
          nix develop --command rustc -Vv > artifacts/rustc-version.txt
          cp flake.lock Cargo.lock artifacts/
          cp kernels/Cargo.lock artifacts/kernels-Cargo.lock
          echo 'cargo build -p vanity-miner --all-features --release --locked; LLVM 7; compute_89' > artifacts/build-command.txt
          (cd artifacts && sha256sum output.ptx > SHA256SUMS)

          echo "Copied build artifacts for ${{ matrix.arch }}"

      - name: Patch ELF interpreter for portability
        if: ${{ inputs.publish_release }}
        run: |
          # Nix bakes a /nix/store/... interpreter path into the binary, which
          # doesn't exist on stock Ubuntu/Debian hosts. Repoint at the standard
          # system path so the binary runs on non-Nix targets.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            INTERP=/lib64/ld-linux-x86-64.so.2
          else
            INTERP=/lib/ld-linux-aarch64.so.1
          fi
          nix develop --command patchelf --set-interpreter "$INTERP" --remove-rpath \
            ./artifacts/vanity-miner-${{ matrix.arch }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanity-miner-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error

      - name: Save Cargo cache even after compilation failures
        if: ${{ !cancelled() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  release:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag and calculate next version
        id: version
        run: |
          # Get the latest tag, fallback to v0.0.0 if no tags exist
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Extract version numbers (remove 'v' prefix if present)
          VERSION=${LATEST_TAG#v}

          # Split version into parts
          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}

          # Increment minor version (you can change this to PATCH if you prefer patch bumps)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="v${MAJOR}.${NEW_MINOR}.0"

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_number=${NEW_VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.new_version }} -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          release_name: Release ${{ steps.version.outputs.new_version }}
          body: |
            ## CUDA Vanity Miner ${{ steps.version.outputs.new_version }}

            ### Build Information
            - **Workflow**: ${{ github.workflow }}
            - **Run ID**: ${{ github.run_id }}
            - **Commit**: ${{ github.sha }}
            - **Built on**: ${{ github.event.repository.updated_at }}
          draft: false
          prerelease: false

      - name: Upload x86_64 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/vanity-miner-x86_64/vanity-miner-x86_64
          asset_name: vanity-miner-x86_64
          asset_content_type: application/octet-stream

      - name: Upload aarch64 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/vanity-miner-aarch64/vanity-miner-aarch64
          asset_name: vanity-miner-aarch64
          asset_content_type: application/octet-stream

      - name: Upload output.ptx
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/vanity-miner-x86_64/output.ptx
          asset_name: output.ptx
          asset_content_type: application/octet-stream
