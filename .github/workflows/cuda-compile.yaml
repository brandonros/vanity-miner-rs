name: cuda-compile

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            arch: x86_64
            llvm: 7
            extra-features: ""
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
            llvm: 7
            extra-features: ""
          - runs-on: ubuntu-24.04
            arch: x86_64
            llvm: 21
            extra-features: ",llvm21"
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
            llvm: 21
            extra-features: ",llvm21"
    name: Build ${{ matrix.arch }} LLVM ${{ matrix.llvm }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: miner-full-llvm${{ matrix.llvm }}-v1-${{ matrix.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            miner-full-llvm${{ matrix.llvm }}-v1-${{ matrix.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Build with nix devshell
        run: |
          nix develop .#v${{ matrix.llvm }} --command cargo build -p vanity-miner --features "gpu,solana,bitcoin,ethereum,shallenge,self_test,rsa-modulus,rsa-pss,p256-public-key,p256-signature${{ matrix.extra-features }}" --release --locked

          mkdir -p artifacts
          cp target/llvm${{ matrix.llvm }}/release/vanity-miner ./artifacts/vanity-miner-${{ matrix.arch }}-llvm${{ matrix.llvm }}

          # PTX targets the selected GPU architecture, independently of the host.
          cp target/llvm${{ matrix.llvm }}/release/ptx/kernels.ptx ./artifacts/output-llvm${{ matrix.llvm }}.ptx

          tar -C target/llvm${{ matrix.llvm }}/release/ptx -czf ./artifacts/ptx-bundle-llvm${{ matrix.llvm }}.tar.gz .

          echo "Copied build artifacts for ${{ matrix.arch }}"

      - name: Patch ELF interpreter for portability
        run: |
          # Nix bakes a /nix/store/... interpreter path into the binary, which
          # doesn't exist on stock Ubuntu/Debian hosts. Repoint at the standard
          # system path so the binary runs on non-Nix targets.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            INTERP=/lib64/ld-linux-x86-64.so.2
          else
            INTERP=/lib/ld-linux-aarch64.so.1
          fi
          nix develop .#v${{ matrix.llvm }} --command patchelf --set-interpreter "$INTERP" --remove-rpath \
            ./artifacts/vanity-miner-${{ matrix.arch }}-llvm${{ matrix.llvm }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanity-miner-${{ matrix.arch }}-llvm${{ matrix.llvm }}
          path: artifacts/

      - name: Save Cargo cache even after compilation failures
        if: ${{ !cancelled() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag and calculate next version
        id: version
        run: |
          # Get the latest tag, fallback to v0.0.0 if no tags exist
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Extract version numbers (remove 'v' prefix if present)
          VERSION=${LATEST_TAG#v}

          # Split version into parts
          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}

          # Increment minor version (you can change this to PATCH if you prefer patch bumps)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="v${MAJOR}.${NEW_MINOR}.0"

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_number=${NEW_VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.new_version }} -m "Release ${{ steps.version.outputs.new_version }}"
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          release_name: Release ${{ steps.version.outputs.new_version }}
          body: |
            ## CUDA Vanity Miner ${{ steps.version.outputs.new_version }}

            ### GPU builds
            - Assets ending in `-llvm7` use LLVM 7 and target `compute_89`.
            - Assets ending in `-llvm21` use LLVM 21 and target `compute_100` (Blackwell or later).
            - `x86_64` and `aarch64` identify the Linux host CPU, not the GPU.
            - Each LLVM version includes both host binaries, production PTX, and a PTX bundle containing the eight separately compiled self-test modules.

            ### Build Information
            - **Workflow**: ${{ github.workflow }}
            - **Run ID**: ${{ github.run_id }}
            - **Commit**: ${{ github.sha }}
            - **Built on**: ${{ github.event.repository.updated_at }}
          draft: false
          prerelease: false

      - name: Upload x86_64 LLVM 7 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/vanity-miner-x86_64-llvm7/vanity-miner-x86_64-llvm7
          asset_name: vanity-miner-x86_64-llvm7
          asset_content_type: application/octet-stream

      - name: Upload aarch64 LLVM 7 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/vanity-miner-aarch64-llvm7/vanity-miner-aarch64-llvm7
          asset_name: vanity-miner-aarch64-llvm7
          asset_content_type: application/octet-stream

      - name: Upload LLVM 7 PTX
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/vanity-miner-x86_64-llvm7/output-llvm7.ptx
          asset_name: output-llvm7.ptx
          asset_content_type: application/octet-stream

      - name: Upload x86_64 LLVM 21 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/vanity-miner-x86_64-llvm21/vanity-miner-x86_64-llvm21
          asset_name: vanity-miner-x86_64-llvm21
          asset_content_type: application/octet-stream

      - name: Upload aarch64 LLVM 21 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/vanity-miner-aarch64-llvm21/vanity-miner-aarch64-llvm21
          asset_name: vanity-miner-aarch64-llvm21
          asset_content_type: application/octet-stream

      - name: Upload LLVM 21 PTX
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/vanity-miner-x86_64-llvm21/output-llvm21.ptx
          asset_name: output-llvm21.ptx
          asset_content_type: application/octet-stream

      - name: Upload LLVM 7 PTX bundle
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/vanity-miner-x86_64-llvm7/ptx-bundle-llvm7.tar.gz
          asset_name: ptx-bundle-llvm7.tar.gz
          asset_content_type: application/gzip

      - name: Upload LLVM 21 PTX bundle
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/vanity-miner-x86_64-llvm21/ptx-bundle-llvm21.tar.gz
          asset_name: ptx-bundle-llvm21.tar.gz
          asset_content_type: application/gzip
