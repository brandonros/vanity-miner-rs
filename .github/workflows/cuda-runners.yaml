name: cuda-runners

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    name: Runner ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: miner-runner-v2-${{ matrix.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            miner-runner-v2-${{ matrix.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Build runner without kernels
        run: |
          nix develop --command cargo build -p vanity-miner --features "gpu,solana,bitcoin,ethereum,shallenge,self_test,rsa-pss,p256-public-key,p256-signature" --release --locked

          mkdir -p artifacts
          cp target/release/vanity-miner ./artifacts/vanity-miner-${{ matrix.arch }}

      - name: Patch ELF interpreter for portability
        run: |
          # Nix bakes a /nix/store/... interpreter path into the binary, which
          # doesn't exist on stock Ubuntu/Debian hosts. Repoint at the standard
          # system path so the binary runs on non-Nix targets.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            INTERP=/lib64/ld-linux-x86-64.so.2
          else
            INTERP=/lib/ld-linux-aarch64.so.1
          fi
          nix develop --command patchelf --set-interpreter "$INTERP" --remove-rpath \
            ./artifacts/vanity-miner-${{ matrix.arch }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanity-miner-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error

      - name: Save Cargo cache even after compilation failures
        if: ${{ !cancelled() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
