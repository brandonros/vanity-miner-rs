name: cuda-kernels

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ptx:
    name: PTX
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: miner-ptx-v2-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            miner-ptx-v2-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Compile PTX
        run: |
          nix develop --command cargo ptx --locked -p 'kernel-*'

          mkdir -p artifacts
          cd target/nvptx64-nvidia-cuda/release
          tar -czf "$GITHUB_WORKSPACE/artifacts/ptx-bundle.tar.gz" *.ptx

      - name: Upload PTX bundle
        uses: actions/upload-artifact@v4
        with:
          name: ptx
          path: artifacts/ptx-bundle.tar.gz
          if-no-files-found: error

      - name: Save Cargo cache even after compilation failures
        if: ${{ !cancelled() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
